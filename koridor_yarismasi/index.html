<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Koridor Yarışması - v2.2.0 (Hafızalı Sürüm)</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  
  <style>
    /* Temel Arayüz Tasarımı */
    #arayuz { position: absolute; top: 20px; left: 20px; z-index: 10; background-color: rgba(0, 0, 0, 0.8); color: #FFD700; padding: 15px 25px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 24px; font-weight: bold; border-radius: 10px; border: 2px solid #FFD700; box-shadow: 0px 4px 10px rgba(0,0,0,0.5); }
    #versiyon-etiketi { position: absolute; bottom: 10px; right: 10px; z-index: 10; color: rgba(255, 255, 255, 0.6); font-family: monospace; font-size: 14px; background-color: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; }
    #mesaj-kutusu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20; background-color: rgba(40, 167, 69, 0.95); color: white; padding: 30px; font-family: sans-serif; font-size: 28px; font-weight: bold; border-radius: 15px; border: 3px solid white; display: none; text-align: center; box-shadow: 0px 0px 20px rgba(0,0,0,0.8); }
    
    /* YENİ: Sıfırlama Butonu Tasarımı */
    #sifirla-butonu { position: absolute; top: 20px; right: 20px; z-index: 10; background-color: rgba(220, 53, 69, 0.8); color: white; padding: 10px 15px; font-family: sans-serif; font-size: 14px; font-weight: bold; border-radius: 8px; border: 2px solid white; cursor: pointer; box-shadow: 0px 2px 5px rgba(0,0,0,0.5); }
    #sifirla-butonu:active { background-color: rgba(220, 53, 69, 1); transform: scale(0.95); }
  </style>
</head>

<body style="margin: 0; overflow: hidden;">

  <div id="arayuz">Puan: <span id="puan-degeri">0</span></div>
  <button id="sifirla-butonu">🔄 Oyunu Sıfırla</button>
  <div id="versiyon-etiketi">Sürüm: v2.2.0</div>
  <div id="mesaj-kutusu">🎉 TEBRİKLER! <br>Koridordaki Tüm Nesneleri Buldun!</div>

  <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="hedef-0" class="hedef-nesne">
      <a-entity position="0 0.5 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
        <a-octahedron color="#FFD700" radius="0.5" metalness="0.8" roughness="0.2"></a-octahedron>
      </a-entity>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 1" id="hedef-1" class="hedef-nesne">
      <a-entity position="0 0.5 0" animation="property: rotation; to: 360 360 0; loop: true; dur: 4000">
        <a-dodecahedron color="#00FF7F" radius="0.5" metalness="0.6" roughness="0.4"></a-dodecahedron>
      </a-entity>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 2" id="hedef-2" class="hedef-nesne">
      <a-entity position="0 0.5 0" animation="property: rotation; to: 0 -360 0; loop: true; dur: 2500">
        <a-tetrahedron color="#1E90FF" radius="0.5" metalness="0.9" roughness="0.1"></a-tetrahedron>
      </a-entity>
    </a-entity>

  </a-scene>

  <script>
    const APP_VERSION = "2.2.0";
    
    // Hedeflerin Temel Veritabanı (3 Nesne)
    const hedefler = {
      "hedef-0": { bulundu: false, puan: 10, isim: "Altın Kristal" },
      "hedef-1": { bulundu: false, puan: 15, isim: "Zümrüt Küre" },
      "hedef-2": { bulundu: false, puan: 20, isim: "Safir Elmas" }
    };

    // YENİ: Tarayıcı Hafızasından (Local Storage) verileri çekme
    let toplamPuan = parseInt(localStorage.getItem('koridorPuan')) || 0;
    let kaydedilenHedefler = JSON.parse(localStorage.getItem('koridorHedefler'));

    // Eğer önceden kaydedilmiş bir ilerleme varsa, hedeflerin durumunu güncelle
    if (kaydedilenHedefler) {
      Object.keys(kaydedilenHedefler).forEach(key => {
        if (hedefler[key]) {
          hedefler[key].bulundu = kaydedilenHedefler[key].bulundu;
        }
      });
    }

    // Arayüz Elementleri
    const puanEkrani = document.querySelector('#puan-degeri');
    const mesajKutusu = document.querySelector('#mesaj-kutusu');
    const tumHedefler = document.querySelectorAll('.hedef-nesne');
    const sifirlaButonu = document.querySelector('#sifirla-butonu');

    // Başlangıçta ekrana hafızadaki puanı yazdır
    puanEkrani.innerText = toplamPuan;

    // YENİ: Oyunu Sıfırlama Mekanizması
    sifirlaButonu.addEventListener('click', () => {
      // Kullanıcıya kazara basmalara karşı onay soruyoruz
      const onay = confirm("Tüm ilerlemeni ve puanını sıfırlamak istediğine emin misin?");
      if (onay) {
        localStorage.removeItem('koridorPuan');
        localStorage.removeItem('koridorHedefler');
        window.location.reload(); // Sayfayı tamamen yenile ve sıfırla
      }
    });

    // Oyun Bitiş Kontrolü
    function oyunBittiMi() {
      const bitis = Object.values(hedefler).every(hedef => hedef.bulundu === true);
      if (bitis) {
        mesajKutusu.style.display = "block";
        console.log(`[v${APP_VERSION}] Oyun Tamamlandı! Toplam Puan: ${toplamPuan}`);
      }
    }

    // Sayfa ilk yüklendiğinde oyunun daha önceden bitip bitmediğini kontrol et
    oyunBittiMi();

    // AR Kamerası Hedefleri Gördüğünde Çalışacak Kodlar
    tumHedefler.forEach(hedefNesne => {
      hedefNesne.addEventListener('targetFound', function() {
        const hedefID = this.id;
        const hedef = hedefler[hedefID]; 
        
        // Eğer bu nesne daha önce bulunmadıysa işlemi yap
        if (!hedef.bulundu) {
          toplamPuan += hedef.puan;
          puanEkrani.innerText = toplamPuan;
          hedef.bulundu = true; 
          
          // YENİ: Güncel puanı ve hedeflerin son durumunu tarayıcı hafızasına kaydet
          localStorage.setItem('koridorPuan', toplamPuan);
          localStorage.setItem('koridorHedefler', JSON.stringify(hedefler));
          
          console.log(`[v${APP_VERSION}] ${hedef.isim} bulundu! Hafızaya kaydedildi.`);
          
          setTimeout(() => {
            alert(`Harika! ${hedef.isim}'i buldun. +${hedef.puan} Puan!`);
            oyunBittiMi(); 
          }, 200);
        }
      });
    });
  </script>
</body>
</html>
