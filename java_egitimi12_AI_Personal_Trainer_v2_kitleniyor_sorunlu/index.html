<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halkalı Gençlik Merkezi - AI Spor Koçu</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>

    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            /* Arka planı kodun içindeki gri ile uyumlu yapalım */
            background-color: #141414; 
            /* Kaydırma çubuklarını gizle (Tam ekran deneyimi) */
            overflow: hidden;
            /* Tuvali ekranın tam ortasına sabitle */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        canvas {
            display: block; /* Tuvalin altındaki boşlukları kaldır */
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.1); /* Hafif neon parlama efekti */
        }
    </style>
</head>
