<html lang="tr">
<head>

    <style>
        :root {
            --primary-blue: #0ea5e9;
            --primary-pink: #ff007f;
            --primary-yellow: #facc15;
            --primary-green: #10b981;
            --primary-purple: #8b5cf6;
            --dark-navy: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark-navy);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(14, 165, 233, 0.1), transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 127, 0.1), transparent 30%);
            background-attachment: fixed;
            color: #f8fafc;
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 40px 20px 30px; 
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo {
            width: 25vw; 
            max-width: 140px; 
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
        }

        h1 {
            font-family: 'Righteous', cursive;
            font-size: 2.8rem; 
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, var(--primary-blue), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
        }

        .subtitle {
            font-size: 1.2rem;
            color: #cbd5e1; 
            margin-top: 5px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto 80px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            padding: 20px;
        }

        .project-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 35px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .project-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .badge {
            align-self: flex-start;
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h2 {
            font-family: 'Righteous', cursive;
            font-size: 1.5rem;
            margin: 0 0 15px 0;
            color: #fff;
        }

        .description {
            font-size: 1rem;
            color: #cbd5e1;
            line-height: 1.6;
            flex-grow: 1;
            margin-bottom: 20px;
        }

        .tech-info {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 18px;
            margin-bottom: 25px;
            border-left: 4px solid var(--primary-blue);
        }

        .tech-info div {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .tech-info span {
            font-weight: 700;
        }

        .btn-launch {
            display: block;
            text-align: center;
            background: #fff;
            color: var(--dark-navy);
            padding: 16px;
            text-decoration: none;
            border-radius: 20px;
            font-weight: 900;
            font-size: 1.1rem;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-top: auto;
            border: none;
            cursor: pointer;
            width: 100%;
            font-family: 'Nunito', sans-serif;
        }

        .project-card:hover .btn-launch:not([disabled]) {
            background: var(--hover-bg, var(--primary-blue));
            color: #fff;
        }

        footer {
            text-align: center;
            padding: 60px;
            color: #64748b;
            font-weight: 700;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
        }

        /* --- SPA / PENCERE GÖRÜNÜMÜ İÇİN EKLENEN CSS --- */
        #projectViewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.98); /* Koyu arka plan */
            z-index: 9999;
            backdrop-filter: blur(10px);
        }

        #projectFrame {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            background: var(--primary-pink);
            color: white;
            border: 2px solid rgba(255,255,255,0.2);
            padding: 12px 25px;
            border-radius: 30px;
            font-family: 'Righteous', cursive;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 10000;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .close-btn:hover {
            background: white;
            color: var(--primary-pink);
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .close-btn { top: 10px; right: 10px; padding: 10px 20px; font-size: 1rem; }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.6rem; }
            .subtitle { font-size: 1rem; letter-spacing: 0.5px; }
        }
    </style>
</head>

            { title: "Geliştirme: Yedek Alan 1", desc: "Yeni eklenecek AR veya yazılım projesi için rezerve edilmiş geliştirici alanı.", link: "#", t1: "Durum", v1: "Boş Slot", t2: "Atama", v2: "Bekleniyor", icon: "fa-folder-plus" },
            { title: "Geliştirme: Yedek Alan 2", desc: "Yeni eklenecek AR veya yazılım projesi için rezerve edilmiş geliştirici alanı.", link: "#", t1: "Durum", v1: "Boş Slot", t2: "Atama", v2: "Bekleniyor", icon: "fa-folder-plus" }
        ];

        const container = document.getElementById('projectContainer');

        function renderProjects() {
            container.innerHTML = ''; 
            
            projectsData.forEach((project, index) => {
                const theme = themes[index % themes.length];
                const idDisplay = (index + 1) < 10 ? '0' + (index + 1) : (index + 1);

                // Eğer link 'http' veya 'file' ile başlıyorsa iframe içinde çalışmaz (Güvenlik engeli), bu yüzden yeni sekmede açtırıyoruz.
                // Eğer link '#' ise henüz boş projedir, tıklanamaz yapıyoruz.
                // Aksi takdirde (kendi klasörlerimiz ise) iframe içinde açmak için openProject() fonksiyonunu çağırıyoruz.
                
                let buttonHTML = '';
                
                if (project.link.startsWith('http') || project.link.startsWith('file')) {
                    buttonHTML = `<a href="${project.link}" target="_blank" class="btn-launch" style="--hover-bg: ${theme.hex}; text-decoration: none; display: block;">Yeni Sekmede Aç</a>`;
                } else if (project.link === '#') {
                    buttonHTML = `<button class="btn-launch" style="background: #334155; color: #94a3b8; cursor: not-allowed;" disabled>Rezerve Edildi</button>`;
                } else {
                    buttonHTML = `<button onclick="openProject('${project.link}')" class="btn-launch" style="--hover-bg: ${theme.hex};">Projeyi Başlat</button>`;
                }

                const cardHTML = `
                    <div class="project-card" style="border-color: ${theme.rgb};">
                        <div class="badge" style="background: ${theme.hex}; color: ${theme.text};">
                            <i class="fa-solid ${project.icon}"></i> DENEYİM ${idDisplay}
                        </div>
                        <h2>${project.title}</h2>
                        <p class="description">
                            ${project.desc}
                        </p>
                        <div class="tech-info" style="border-left-color: ${theme.hex};">
                            <div>${project.t1}: <span style="color: ${theme.hex}">${project.v1}</span></div>
                            <div>${project.t2}: <span style="color: ${theme.hex}">${project.v2}</span></div>
                        </div>
                        ${buttonHTML}
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // SPA (Iframe) Kontrol Fonksiyonları
        function openProject(url) {
            const viewer = document.getElementById('projectViewer');
            const frame = document.getElementById('projectFrame');
            
            frame.src = url;
            viewer.style.display = 'block';
            document.body.style.overflow = 'hidden'; // Ana ekranın aşağı kaymasını engeller
        }

        function closeProject() {
            const viewer = document.getElementById('projectViewer');
            const frame = document.getElementById('projectFrame');
            
            frame.src = ''; // Iframe içeriğini siler (Arka planda ses/kamera çalışmaya devam etmesin diye)
            viewer.style.display = 'none';
            document.body.style.overflow = 'auto'; // Ana ekran kaydırmasını geri açar
        }

        window.onload = renderProjects;
    </script>
